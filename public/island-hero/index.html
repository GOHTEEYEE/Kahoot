<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>墨香书院 · Island Hero</title>
    <style>
      :root {
        --sky-top: #8ec8ea;
        --sky-mid: #c5e6f7;
        --sky-bot: #e8f4dc;
        --glow: rgba(255, 236, 180, 0.35);
        --shadow: rgba(24, 48, 32, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
      }

      .stage--preview {
        background:
          radial-gradient(ellipse at 50% 18%, rgba(255, 255, 255, 0.55) 0%, transparent 45%),
          linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 46%, var(--sky-bot) 100%);
      }

      .island {
        position: relative;
        width: min(100%, 360px);
        aspect-ratio: 624 / 680;
        display: grid;
        place-items: center;
      }

      .island__glow {
        position: absolute;
        left: 50%;
        bottom: 8%;
        width: 72%;
        height: 28%;
        transform: translateX(-50%);
        border-radius: 100%;
        background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 70%);
        filter: blur(14px);
        pointer-events: none;
        z-index: 0;
      }

      .island__shadow {
        position: absolute;
        left: 50%;
        bottom: 2%;
        width: 58%;
        height: 12%;
        transform: translateX(-50%);
        border-radius: 100%;
        background: radial-gradient(ellipse at center, var(--shadow) 0%, transparent 72%);
        filter: blur(8px);
        pointer-events: none;
        z-index: 0;
      }

      .island__art {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        filter: drop-shadow(0 18px 28px rgba(30, 50, 35, 0.28));
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .island__hit {
        position: absolute;
        inset: 8%;
        z-index: 2;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }

      .island__hit:focus-visible {
        outline: 2px solid rgba(101, 200, 74, 0.85);
        outline-offset: 4px;
        border-radius: 24px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .stage--preview .island {
          animation: float-y 6.5s ease-in-out infinite;
        }
      }

      @keyframes float-y {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage" aria-label="墨香书院岛屿">
      <figure class="island">
        <span class="island__glow" aria-hidden="true"></span>
        <span class="island__shadow" aria-hidden="true"></span>
        <img
          class="island__art"
          src="./island.png"
          alt="墨香书院：浮动岛屿、书院建筑与熊猫墨墨"
          width="624"
          height="680"
          decoding="async"
        />
        <button class="island__hit" type="button" aria-label="查看关卡地图" id="island-hit"></button>
      </figure>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.get("preview") === "1") {
          document.getElementById("stage").classList.add("stage--preview");
        }
        var hit = document.getElementById("island-hit");
        hit.addEventListener("click", function () {
          try {
            parent.postMessage({ type: "island-click" }, "*");
          } catch (_) {}
        });
      })();
    </script>
  </body>
</html>
